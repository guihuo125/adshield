<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邮箱验证成功 · AdShield</title>
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="AdShield 邮箱验证成功" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f7f9fb;
      color: #202225;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* 顶部品牌栏 */
    .navbar {
      background: #fff;
      border-bottom: 1px solid #e8eaed;
      padding: 14px 0;
    }
    .navbar-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .navbar-logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #00aef0, #0077cc);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,174,240,.3);
    }
    .navbar-name {
      font-size: 16px;
      font-weight: 700;
      color: #202225;
      letter-spacing: -0.2px;
    }
    .navbar-badge {
      margin-left: auto;
      font-size: 12px;
      color: #636568;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #f7f9fb;
      border: 1px solid #e8eaed;
      border-radius: 999px;
    }
    .navbar-badge .dot {
      width: 6px; height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(16,185,129,.15);
    }

    /* 主内容 */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e8eaed;
      box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 8px 32px rgba(0,0,0,.06);
      padding: 56px 44px 44px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    /* 成功图标 */
    .success-icon {
      width: 80px; height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 8px 24px rgba(16,185,129,.35);
      animation: popIn .4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .success-icon::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(16,185,129,.2);
      animation: pulse 2s infinite;
    }
    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.08); }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #202225;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 15px;
      color: #636568;
      line-height: 1.65;
      margin-bottom: 32px;
    }

    /* 步骤区 */
    .steps-box {
      background: #f7f9fb;
      border: 1px solid #e8eaed;
      border-radius: 12px;
      padding: 20px 24px;
      text-align: left;
      margin-bottom: 28px;
    }
    .steps-box-title {
      font-size: 12px;
      font-weight: 700;
      color: #636568;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13.5px;
      color: #3f4146;
      line-height: 1.55;
      padding: 6px 0;
    }
    .step-num {
      width: 22px; height: 22px;
      flex-shrink: 0;
      background: #fff;
      border: 1.5px solid #d0d3d6;
      color: #636568;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 700;
      margin-top: 1px;
    }

    /* 按钮 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      background: #00aef0;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: background .15s, transform .15s, box-shadow .15s;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(0,174,240,.3);
    }
    .btn:hover {
      background: #0077cc;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,174,240,.4);
    }

    /* 安全提示 */
    .security-note {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #f0f2f4;
      font-size: 12px;
      color: #9ca3af;
      justify-content: center;
    }
    .security-note svg {
      flex-shrink: 0;
    }

    /* 底部 */
    .footer {
      padding: 24px;
      text-align: center;
      font-size: 12.5px;
      color: #9ca3af;
      border-top: 1px solid #e8eaed;
      background: #fff;
    }
    .footer-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .footer a {
      color: #636568;
      text-decoration: none;
      transition: color .15s;
    }
    .footer a:hover {
      color: #00aef0;
    }
    .footer-sep {
      color: #d0d3d6;
    }

    @media (max-width: 560px) {
      .card { padding: 40px 24px 32px; }
      h1 { font-size: 22px; }
      .navbar-badge { display: none; }
      .footer-inner { gap: 12px; }
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="navbar-logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <span class="navbar-name">AdShield</span>
      <div class="navbar-badge">
        <span class="dot"></span>
        安全连接
      </div>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="main">
    <div class="card">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <h1>邮箱验证成功</h1>
      <p class="subtitle">
        您的 AdShield 账号已激活<br>
        现在可以登录并开始使用了
      </p>

      <div class="steps-box">
        <div class="steps-box-title">接下来的步骤</div>
        <div class="step">
          <span class="step-num">1</span>
          <span>关闭当前浏览器标签页</span>
        </div>
        <div class="step">
          <span class="step-num">2</span>
          <span>回到浏览器，打开 <strong>AdShield 设置</strong></span>
        </div>
        <div class="step">
          <span class="step-num">3</span>
          <span>在「账号」页面使用邮箱和密码登录</span>
        </div>
      </div>

      <button class="btn" onclick="tryClose()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        我已了解，关闭此页面
      </button>

      <div class="security-note">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        此页面由 GitHub Pages 安全托管，未收集任何信息
      </div>
    </div>
  </main>

  <!-- 底部 -->
  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 AdShield</span>
      <span class="footer-sep">·</span>
      <a href="https://github.com/guihuo125/adshield" target="_blank" rel="noopener">GitHub</a>
      <span class="footer-sep">·</span>
      <a href="https://github.com/guihuo125/adshield/blob/main/PRIVACY.md" target="_blank" rel="noopener">隐私政策</a>
      <span class="footer-sep">·</span>
      <a href="https://microsoftedge.microsoft.com/addons/detail/ogjodahjklhodkmnjhopkopflngicokg" target="_blank" rel="noopener">Edge 商店</a>
    </div>
  </footer>

  <script>
    // 安全：立即清除 URL 里的 access_token
    if (location.hash) {
      history.replaceState(null, "", location.pathname + location.search);
    }

    function tryClose() {
      window.close();
      setTimeout(() => {
        // 如果无法关闭（非脚本打开），显示提示
        document.querySelector('.btn').outerHTML =
          '<div style="padding:12px 20px;background:#e7f6fe;color:#0077cc;border-radius:10px;font-size:13.5px;font-weight:600;">请手动关闭此标签页，然后回到 AdShield 登录 ✓</div>';
      }, 200);
    }
  </script>
</body>
</html>
